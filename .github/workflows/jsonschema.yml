name: JSON Schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@v2

      - name: Check the schema
        run: mise run lint

      - name: Run the schema unit tests
        run: mise run test

      - name: Validate the example gleam.toml files
        run: mise run validate
